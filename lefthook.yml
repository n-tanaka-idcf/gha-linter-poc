# yaml-language-server: $schema=https://raw.githubusercontent.com/evilmartians/lefthook/v2.2.2/schema.json
---
pre-commit:
  jobs:
    # Lint all workflows, not only staged ones, because actionlint checks
    # across files (reusable workflow callers, local action inputs)
    - name: actionlint
      glob:
        - ".github/workflows/*.{yml,yaml}"
        - ".github/actionlint.{yml,yaml}"
        - "**/action.{yml,yaml}"
      run: actionlint
