# yaml-language-server: $schema=https://raw.githubusercontent.com/evilmartians/lefthook/v2.2.2/schema.json
---
pre-commit:
  # Glob patterns used by several jobs are defined once with a YAML anchor
  # (&name) and reused with an alias (*name)
  jobs:
    # Lint all workflows, not only staged ones, because actionlint checks
    # across files (reusable workflow callers, local action inputs)
    - name: actionlint
      glob:
        - &workflows ".github/workflows/*.{yml,yaml}"
        - ".github/actionlint.{yml,yaml}"
        - &actions "**/action.{yml,yaml}"
      run: task lint:actionlint
    # ghalint takes no file arguments and always lints all workflows
    - name: ghalint
      glob:
        - *workflows
        - &ghalint_config "{,.}ghalint.{yml,yaml}"
        - &ghalint_config_in_github ".github/{,.}ghalint.{yml,yaml}"
      run: task lint:ghalint
    - name: ghalint run-action
      glob:
        - *actions
        - *ghalint_config
        - *ghalint_config_in_github
      run: task lint:ghalint-action
    # zizmor audits all workflows, actions, Dependabot configs and pre-commit
    # configs under the repository. Run offline so the hook needs no GitHub
    # token or network; online audits (e.g. impostor-commit) run in CI
    - name: zizmor
      glob:
        - *workflows
        - *actions
        - ".github/dependabot.{yml,yaml}"
        - ".pre-commit-config.{yml,yaml}"
        - ".pre-commit-hooks.yaml"
        # zizmor reads only zizmor.yml / zizmor.yaml (no dotfile variants)
        - "{,.github/}zizmor.{yml,yaml}"
      run: task lint:zizmor
    # ghasec checks all workflows and actions under the repository. Run
    # offline so the hook needs no GitHub token or network; online rules run
    # in CI
    - name: ghasec
      glob:
        - *workflows
        - *actions
      run: task lint:ghasec
    # Check that every action in the workflows has an entry in the workflow
    # lockfile. --verify-local runs offline and checks coverage only; CI runs
    # --verify, which also checks that the locked commits verify upstream
    - name: gh actions-lock
      glob:
        - *workflows
        - ".github/workflows/actions.lock"
      run: task lint:actions-lock
