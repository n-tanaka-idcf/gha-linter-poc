---
name: run_actionlint

on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actionlint.yaml
      - .github/actionlint.yml
      - "**/action.yml"
      - "**/action.yaml"
      - mise.toml
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/actionlint.yaml
      - .github/actionlint.yml
      - "**/action.yml"
      - "**/action.yaml"
      - mise.toml
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install actionlint and shellcheck (used by actionlint for run: scripts)
      # at the versions pinned in mise.toml. Keep the mise version in sync with
      # .devcontainer/github-actions/devcontainer.json
      - name: Install actionlint and shellcheck
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.25
          install_args: actionlint shellcheck

      # Show errors as annotations on the PR diff. The matcher is copied from
      # https://github.com/rhysd/actionlint/blob/v1.7.12/.github/actionlint-matcher.json
      - name: Run actionlint
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          actionlint -color
